plugins {
    id 'com.android.application'
}

android {
    namespace 'com.debangshu.money'
    compileSdk 34

    defaultConfig {
        applicationId 'com.debangshu.money'
        minSdk 24          // Android 7.0 and newer
        targetSdk 34
        versionCode 12
        versionName '1.9.3'
    }

    // One fixed key for this app, so every new APK installs as an update and keeps your data.
    // The key file is made by GitHub on the first build and kept in keystore/, locked with YOUR password
    // (the repo Secret MONEY_KEY_PASSWORD). Without the password nobody can use it.
    def ksFile = rootProject.file('keystore/money.p12')
    def ksPass = System.getenv('MONEY_KEY_PASSWORD')
    def hasKey = ksPass != null && !ksPass.isEmpty() && ksFile.exists()
    signingConfigs {
        release {
            if (hasKey) {
                storeFile ksFile
                storeType 'pkcs12'
                storePassword ksPass
                keyAlias 'money'
                keyPassword ksPass
            }
        }
    }

    buildTypes {
        release {
            minifyEnabled false
            signingConfig hasKey ? signingConfigs.release : signingConfigs.debug
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
        encoding 'UTF-8'
    }

    lint {
        abortOnError false
        checkReleaseBuilds false
    }
}

dependencies {
    // Scan & Pay: Google's QR scanner (Google Play services shows the camera; Money needs no camera permission)
    implementation 'com.google.android.gms:play-services-code-scanner:16.1.0'
}
